name: CI JavaScript y Notificación a ntfy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Instalar y validar
        run: |
          npm ci
          npm run lint
          npm test

  notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Enviar petición POST a ntfy.sh
        run: |
          curl -H "Title: Nuevo Push en Main" \
               -H "Tags: rocket, github" \
               -H "Priority: default" \
               -d "El usuario ${{ github.actor }} acaba de subir código. Commit: ${{ github.event.head_commit.message }}" \
               https://ntfy.sh/devops-itla